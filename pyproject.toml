[project]
name = "smart-trainer"
dynamic = ["version"]  # from CHANGELOG.md, see [tool.hatch.version]
description = "Indoor cycling smart-trainer app (BLE FTMS, power meter, HR) with intervals.icu sync"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Michele Vascellari", email = "michele.vascellari@gmail.com" }]
keywords = ["cycling", "smart-trainer", "ftms", "bluetooth", "intervals.icu", "nicegui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "bleak>=0.22",
    "nicegui>=2.0",
    "httpx>=0.27",
    "fit-tool>=0.9.13",
    "pydantic>=2.7",
    "keyring>=25",
]

[project.optional-dependencies]
# Desktop window (pywebview) instead of a browser tab: `smart-trainer --native`
app = ["nicegui[native]>=2.0"]

[project.urls]
Homepage = "https://github.com/mighelone/smart-trainer"
Issues = "https://github.com/mighelone/smart-trainer/issues"

[project.scripts]
smart-trainer = "smart_trainer.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fitdecode>=0.10",
    "ruff>=0.17.5",
    "pyrefly>=1.4.1",
    "prek>=0.5.10",
    "pytest-cov>=7.1.0",
    # `smart-trainer --native` in development: plain `uv run` would remove the app extra
    "nicegui[native]>=2.0",
]
# Builds the macOS .app (see packaging/)
package = [
    "pyinstaller>=6.10",
    "nicegui[native]>=2.0",
]

# The version is the first released heading in CHANGELOG.md: "## [X.Y.Z] - date"
[tool.hatch.version]
source = "regex"
path = "CHANGELOG.md"
pattern = '^## \[(?P<version>\d[^\]]*)\]'

[tool.hatch.build.targets.sdist]
include = ["smart_trainer", "tests", "README.md", "CHANGELOG.md", "INSTALL.md"]

[tool.uv]
# Rebuild the project metadata when the changelog (and so the version) changes
cache-keys = [{ file = "pyproject.toml" }, { file = "CHANGELOG.md" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# NiceGUI simulated user (`user` fixture) for the UI tests in tests/test_ui.py
addopts = ["-p", "nicegui.testing.user_plugin"]

[tool.coverage.run]
source = ["smart_trainer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 72  # never lower it; raise it as coverage grows, towards 80

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B",
    "SIM",  # flake8-simplify (catches overly verbose logic)
    "C90",  # McCabe cyclomatic complexity
    "PLR",  # Pylint refactor & structural limits
    "ERA",  # no commented-out code
    "TD",   # TODOs must be written TODO(#N): … with an open issue
]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"smart_trainer/ble/parsers.py" = ["PLR2004"]  # payload-length checks / byte offsets

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 4
max-branches = 10
max-args = 8

[tool.pyrefly]
project-includes = ["smart_trainer", "tests"]
python-interpreter-path = ".venv/bin/python"
