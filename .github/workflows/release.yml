name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Zrc1` for a pre-release) to build the macOS DMGs and
# attach them to a GitHub Release. "Run workflow" in the Actions tab builds them as
# downloadable run artifacts only, without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos-app:
    runs-on: macos-15  # Apple Silicon (arm64) only
    env:
      # Optional signing/notarization; without these secrets the app is ad-hoc signed.
      # (secrets can't be tested in `if:` directly)
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches the CHANGELOG.md version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --no-project python packaging/version.py --check "$GITHUB_REF_NAME"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Write notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"

      - name: Build app and DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_KEY_PATH: ${{ env.HAS_NOTARY == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: macos-app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          generate_release_notes: true
