name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The pyrefly hook runs from the project venv, so sync it first.
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --frozen prek run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest --cov --cov-report=term
      - name: Coverage summary
        if: always()
        run: uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
